<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Top ring arc for DOMINION GROUP OF SCHOOLS -->
    <path id="topTextArc" d="M 120,380 A 280,280 0 1,1 680,380" fill="none" />
    
    <!-- Bottom ribbon arc for RAISING THE DOMINION CHILD -->
    <path id="bottomRibbonArc" d="M 120,735 Q 400,775 680,735" fill="none" />

    <!-- Left shield top banner arc -->
    <path id="leftShieldTopArc" d="M 190,265 Q 275,250 360,265" fill="none" />

    <!-- Right shield top banner arc -->
    <path id="rightShieldTopArc" d="M 440,265 Q 525,250 610,265" fill="none" />

    <!-- Drop shadow for depth -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <g id="dominion-emblem">
    <!-- ========================================== -->
    <!-- 1. MAIN CIRCULAR SEAL FRAME               -->
    <!-- ========================================== -->
    
    <!-- Outer Black Circle with Gold Outlines -->
    <circle cx="400" cy="380" r="340" fill="#0c0d0e" stroke="#cfa135" stroke-width="8" />
    <circle cx="400" cy="380" r="332" fill="none" stroke="#f6d365" stroke-width="2" opacity="0.8" />
    
    <!-- Inner White/Cream Shield Field -->
    <circle cx="400" cy="380" r="248" fill="#ffffff" stroke="#cfa135" stroke-width="8" />
    <circle cx="400" cy="380" r="240" fill="none" stroke="#f6d365" stroke-width="2" opacity="0.8" />

    <!-- Outer Circular Rim Heading: DOMINION GROUP OF SCHOOLS -->
    <text fill="#ffffff" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-weight="900" font-size="43" letter-spacing="4">
      <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">DOMINION GROUP OF SCHOOLS</textPath>
    </text>

    <!-- Small Golden Star Dividers on rim -->
    <circle cx="106" cy="400" r="6" fill="#f6d365" stroke="#cfa135" stroke-width="2" />
    <circle cx="694" cy="400" r="6" fill="#f6d365" stroke="#cfa135" stroke-width="2" />

    <!-- ========================================== -->
    <!-- 2. LEFT SHIELD: NURSERY & PRIMARY SCHOOL   -->
    <!-- ========================================== -->
    <g id="left-shield" transform="translate(0, 0)">
      <!-- Shield Outer Contour -->
      <!-- Shield Path: (180,260) to (365,260), down to y=400, curved to point (272, 530) -->
      <clipPath id="leftShieldClip">
        <path d="M 185,260 Q 272,248 360,260 L 360,405 Q 360,490 272,530 Q 185,490 185,405 Z" />
      </clipPath>

      <!-- Shield Background: Upper White, Lower Red -->
      <g clip-path="url(#leftShieldClip)">
        <!-- Upper Field: White -->
        <rect x="180" y="240" width="185" height="150" fill="#ffffff" />
        
        <!-- Lower Field: Crimson Red -->
        <rect x="180" y="380" width="185" height="160" fill="#c4121a" />
        <line x1="180" y1="380" x2="365" y2="380" stroke="#000000" stroke-width="3" />

        <!-- Upper Content: Mortarboard & Scrolls -->
        <g transform="translate(272, 320)">
          <!-- Graduation Cap (Mortarboard) -->
          <polygon points="-40,-12 0,-26 40,-12 0,2" fill="#111111" stroke="#222" stroke-width="1.5" />
          <path d="M -16,-2 L -16,10 Q 0,16 16,10 L 16,-2 Z" fill="#0a0a0a" />
          <!-- Tassel hanging left -->
          <circle cx="0" cy="-12" r="3" fill="#c4121a" />
          <path d="M 0,-12 C -18,-10 -35,-5 -36,8" fill="none" stroke="#c4121a" stroke-width="2.5" />
          <rect x="-38" y="8" width="5" height="8" rx="1.5" fill="#c4121a" />

          <!-- Stacked Diploma Scrolls below Cap -->
          <g transform="translate(0, 24)">
            <!-- Back scroll -->
            <rect x="-32" y="-9" width="64" height="12" rx="6" fill="#f4eedb" stroke="#333" stroke-width="1.5" />
            <ellipse cx="32" cy="-3" rx="4" ry="6" fill="#e8dfc7" stroke="#333" stroke-width="1.5" />
            <!-- Front scroll -->
            <rect x="-28" y="2" width="56" height="12" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5" />
            <ellipse cx="28" cy="8" rx="4" ry="6" fill="#f0ebe0" stroke="#333" stroke-width="1.5" />
            <!-- Red ribbon bow tied around scrolls -->
            <rect x="-5" y="-10" width="10" height="26" fill="#c4121a" />
            <path d="M -5,3 C -16,0 -16,-10 -6,-5 Z" fill="#c4121a" />
            <path d="M 5,3 C 16,0 16,-10 6,-5 Z" fill="#c4121a" />
            <path d="M -4,5 L -10,18 L -3,14 Z" fill="#c4121a" />
            <path d="M 4,5 L 10,18 L 3,14 Z" fill="#c4121a" />
          </g>
        </g>

        <!-- Lower Content: NURSERY & PRIMARY SCHOOL -->
        <g transform="translate(272, 408)">
          <text text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="14.5" letter-spacing="0.5">
            NURSERY &amp; PRIMARY
          </text>
          <text y="19" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="17" letter-spacing="1">
            SCHOOL
          </text>
          <!-- Black Pill: ALLOMA -->
          <g transform="translate(0, 36)">
            <rect x="-42" y="-11" width="84" height="20" rx="6" fill="#0c0d0e" />
            <text y="4" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="13" letter-spacing="1">
              ALLOMA
            </text>
          </g>
        </g>
      </g>

      <!-- Shield Borders -->
      <path d="M 185,260 Q 272,248 360,260 L 360,405 Q 360,490 272,530 Q 185,490 185,405 Z" fill="none" stroke="#c4121a" stroke-width="12" stroke-linejoin="round" />
      <path d="M 185,260 Q 272,248 360,260 L 360,405 Q 360,490 272,530 Q 185,490 185,405 Z" fill="none" stroke="#000000" stroke-width="2" />
      <path d="M 191,265 Q 272,254 354,265 L 354,403 Q 354,484 272,522 Q 191,484 191,403 Z" fill="none" stroke="#f6d365" stroke-width="2" />

      <!-- Top Black Tab: DOMINION -->
      <path d="M 190,265 Q 272,248 355,265 L 350,290 Q 272,274 195,290 Z" fill="#0c0d0e" stroke="#c4121a" stroke-width="2.5" />
      <text fill="#ffffff" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="20" letter-spacing="2">
        <textPath href="#leftShieldTopArc" startOffset="50%" text-anchor="middle">DOMINION</textPath>
      </text>

      <!-- Folded Red Ribbon Beneath Left Shield: BE LED TO LEAD -->
      <g transform="translate(272, 545)">
        <!-- Folded ends -->
        <polygon points="-115,-3 -90,-16 -90,10 -115,16 -103,4" fill="#8f0c12" />
        <polygon points="115,-3 90,-16 90,10 115,16 103,4" fill="#8f0c12" />
        <!-- Main Ribbon Body -->
        <path d="M -92,-10 Q 0,4 92,-10 L 92,16 Q 0,30 -92,16 Z" fill="#c4121a" stroke="#000000" stroke-width="2" />
        <text y="10" text-anchor="middle" fill="#0c0d0e" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="16" letter-spacing="1">
          BE LED TO LEAD
        </text>
      </g>
    </g>

    <!-- ========================================== -->
    <!-- 3. RIGHT SHIELD: SECONDARY SCHOOL          -->
    <!-- ========================================== -->
    <g id="right-shield" transform="translate(0, 0)">
      <!-- Shield Outer Contour -->
      <clipPath id="rightShieldClip">
        <path d="M 440,260 Q 528,248 615,260 L 615,405 Q 615,490 528,530 Q 440,490 440,405 Z" />
      </clipPath>

      <!-- Shield Background Quadrants -->
      <g clip-path="url(#rightShieldClip)">
        <!-- Q1 Top-Left: Black -->
        <rect x="435" y="240" width="93" height="150" fill="#0c0d0e" />
        <!-- Q2 Top-Right: Warm Gold -->
        <rect x="528" y="240" width="93" height="150" fill="#cfa135" />
        <!-- Q3 Bottom-Left: Warm Gold -->
        <rect x="435" y="380" width="93" height="150" fill="#cfa135" />
        <!-- Q4 Bottom-Right: Black -->
        <rect x="528" y="380" width="93" height="150" fill="#0c0d0e" />

        <!-- Quadrant Divider Lines -->
        <line x1="435" y1="380" x2="620" y2="380" stroke="#0c0d0e" stroke-width="3" />
        <line x1="528" y1="240" x2="528" y2="530" stroke="#0c0d0e" stroke-width="3" />

        <!-- Q1 Icon: Open Book with gold page edges -->
        <g transform="translate(482, 335) scale(0.9)">
          <path d="M -22,-14 Q -10,-18 0,-12 Q 10,-18 22,-14 L 22,12 Q 10,8 0,14 Q -10,8 -22,12 Z" fill="#ffffff" stroke="#f6d365" stroke-width="2" />
          <line x1="0" y1="-12" x2="0" y2="14" stroke="#cfa135" stroke-width="2.5" />
          <!-- Page text lines -->
          <line x1="-18" y1="-7" x2="-4" y2="-5" stroke="#333333" stroke-width="1.5" />
          <line x1="-18" y1="-1" x2="-4" y2="1" stroke="#333333" stroke-width="1.5" />
          <line x1="-18" y1="5" x2="-4" y2="7" stroke="#333333" stroke-width="1.5" />
          <line x1="4" y1="-5" x2="18" y2="-7" stroke="#333333" stroke-width="1.5" />
          <line x1="4" y1="1" x2="18" y2="-1" stroke="#333333" stroke-width="1.5" />
          <line x1="4" y1="7" x2="18" y2="5" stroke="#333333" stroke-width="1.5" />
        </g>

        <!-- Q2 Icon: Torch of Knowledge -->
        <g transform="translate(574, 332) scale(0.95)">
          <!-- Torch Handle & Bowl -->
          <polygon points="-8,-4 -4,22 4,22 8,-4" fill="#0c0d0e" />
          <ellipse cx="0" cy="-4" rx="10" ry="3.5" fill="#333" stroke="#0c0d0e" stroke-width="1.5" />
          <!-- Flame (multi-layer) -->
          <path d="M 0,-28 C 10,-18 12,-10 8,-4 C 3,-1 -3,-1 -8,-4 C -12,-10 -10,-18 0,-28 Z" fill="#ff4d00" />
          <path d="M 0,-24 C 6,-16 7,-10 4,-5 C 2,-2 -2,-2 -4,-5 C -7,-10 -6,-16 0,-24 Z" fill="#ffbb00" />
          <path d="M 0,-20 C 3,-14 4,-10 2,-6 C 1,-4 -1,-4 -2,-6 C -4,-10 -3,-14 0,-20 Z" fill="#ffffff" />
        </g>

        <!-- Q3 Icon: Globe with Continents -->
        <g transform="translate(482, 426) scale(0.9)">
          <circle cx="0" cy="0" r="22" fill="#ffffff" stroke="#0c0d0e" stroke-width="2.5" />
          <!-- Continents in dark tone -->
          <path d="M -14,-10 Q -6,-16 -2,-8 Q 4,-12 12,-6 Q 16,4 8,12 Q -2,16 -12,10 Q -18,2 -14,-10 Z" fill="#5a3d12" opacity="0.85" />
          <path d="M -22,0 A 22,22 0 0,0 22,0" fill="none" stroke="#0c0d0e" stroke-width="1.5" />
          <ellipse cx="0" cy="0" rx="12" ry="22" fill="none" stroke="#0c0d0e" stroke-width="1.5" />
          <line x1="0" y1="-22" x2="0" y2="22" stroke="#0c0d0e" stroke-width="1.5" />
        </g>

        <!-- Q4 Icon: Graduation Cap -->
        <g transform="translate(574, 426) scale(0.95)">
          <polygon points="-24,-5 0,-14 24,-5 0,4" fill="#ffffff" stroke="#cfa135" stroke-width="1.5" />
          <path d="M -10,0 L -10,8 Q 0,12 10,8 L 10,0 Z" fill="#e8dfc7" />
          <circle cx="0" cy="-5" r="2" fill="#cfa135" />
          <path d="M 0,-5 C -10,-4 -20,0 -22,8" fill="none" stroke="#cfa135" stroke-width="1.5" />
        </g>

        <!-- Center Round Medallion: Victorious Scholar Figure -->
        <g transform="translate(528, 380)">
          <circle cx="0" cy="0" r="26" fill="#0c0d0e" stroke="#cfa135" stroke-width="3.5" />
          <circle cx="0" cy="0" r="22.5" fill="#111111" stroke="#f6d365" stroke-width="1" />
          <!-- Dynamic Leaping Scholar Silhouette -->
          <!-- Head / Cap -->
          <circle cx="0" cy="-10" r="4.5" fill="#ffffff" />
          <!-- Cap Diamond -->
          <polygon points="-6,-13 0,-15.5 6,-13 0,-10.5" fill="#f6d365" />
          <!-- Body in motion -->
          <path d="M -2,-5 C -3,2 -3,7 -1,13 C 2,13 4,9 3,3 C 2,-2 0,-5 -2,-5 Z" fill="#ffffff" />
          <!-- Left Arm reaching high up in victory -->
          <path d="M -2,-3 C -7,-8 -12,-12 -14,-14 C -13,-15 -11,-15 -8,-10 C -4,-6 -2,-3 -2,-3 Z" fill="#ffffff" />
          <!-- Right Arm reaching high up in victory -->
          <path d="M 0,-3 C 5,-8 11,-12 14,-14 C 14,-15 12,-15 8,-10 C 4,-6 0,-3 0,-3 Z" fill="#ffffff" />
          <!-- Leaping Legs -->
          <path d="M -1,10 C -5,13 -9,16 -12,18 C -11,19 -9,19 -6,16 C -3,14 -1,11 -1,10 Z" fill="#ffffff" />
          <path d="M 1,10 C 5,13 9,16 13,17 C 12,18 10,18 7,15 C 4,13 1,11 1,10 Z" fill="#ffffff" />
        </g>

        <!-- Lower Section Black Banner: SECONDARY SCHOOL ALLOMA -->
        <g transform="translate(528, 474)">
          <rect x="-85" y="-12" width="170" height="42" fill="#0c0d0e" stroke="#cfa135" stroke-width="2" />
          <text y="5" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="14" letter-spacing="0.5">
            SECONDARY SCHOOL
          </text>
          <text y="22" text-anchor="middle" fill="#f6d365" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="12" letter-spacing="1">
            ALLOMA
          </text>
        </g>
      </g>

      <!-- Shield Borders -->
      <path d="M 440,260 Q 528,248 615,260 L 615,405 Q 615,490 528,530 Q 440,490 440,405 Z" fill="none" stroke="#cfa135" stroke-width="12" stroke-linejoin="round" />
      <path d="M 440,260 Q 528,248 615,260 L 615,405 Q 615,490 528,530 Q 440,490 440,405 Z" fill="none" stroke="#000000" stroke-width="2" />
      <path d="M 446,265 Q 528,254 609,265 L 609,403 Q 609,484 528,522 Q 446,484 446,403 Z" fill="none" stroke="#f6d365" stroke-width="2" />

      <!-- Top Black Tab: DOMINION -->
      <path d="M 445,265 Q 528,248 610,265 L 605,290 Q 528,274 450,290 Z" fill="#0c0d0e" stroke="#cfa135" stroke-width="2.5" />
      <text fill="#ffffff" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="20" letter-spacing="2">
        <textPath href="#rightShieldTopArc" startOffset="50%" text-anchor="middle">DOMINION</textPath>
      </text>

      <!-- Folded Gold Ribbon Beneath Right Shield: RAISING THE ABSOLUTE BEST -->
      <g transform="translate(528, 545)">
        <!-- Folded ends -->
        <polygon points="-125,-3 -100,-16 -100,10 -125,16 -113,4" fill="#8c6a1e" />
        <polygon points="125,-3 100,-16 100,10 125,16 113,4" fill="#8c6a1e" />
        <!-- Main Ribbon Body -->
        <path d="M -102,-10 Q 0,4 102,-10 L 102,16 Q 0,30 -102,16 Z" fill="#cfa135" stroke="#000000" stroke-width="2" />
        <text y="10" text-anchor="middle" fill="#0c0d0e" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="13" letter-spacing="0.5">
          RAISING THE ABSOLUTE BEST
        </text>
      </g>
    </g>

    <!-- ========================================== -->
    <!-- 4. BOTTOM MAIN RIBBON: RAISING THE CHILD   -->
    <!-- ========================================== -->
    <g id="bottom-main-ribbon" filter="url(#shadow)">
      <!-- Left Dovetail Tail -->
      <polygon points="40,710 120,685 120,740 40,765 75,737" fill="#0c0d0e" stroke="#cfa135" stroke-width="4" />
      <polygon points="120,740 120,705 145,715" fill="#8c6a1e" stroke="#000000" stroke-width="2" />

      <!-- Right Dovetail Tail -->
      <polygon points="760,710 680,685 680,740 760,765 725,737" fill="#0c0d0e" stroke="#cfa135" stroke-width="4" />
      <polygon points="680,740 680,705 655,715" fill="#8c6a1e" stroke="#000000" stroke-width="2" />

      <!-- Center Arched Black Banner -->
      <path d="M 90,695 Q 400,745 710,695 L 710,750 Q 400,800 90,750 Z" fill="#0c0d0e" stroke="#cfa135" stroke-width="5" />
      <path d="M 94,701 Q 400,751 706,701 L 706,744 Q 400,794 94,744 Z" fill="none" stroke="#f6d365" stroke-width="1.5" />

      <!-- Ribbon Text: RAISING THE DOMINION CHILD -->
      <text fill="#ffffff" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="33" letter-spacing="3.5">
        <textPath href="#bottomRibbonArc" startOffset="50%" text-anchor="middle">RAISING THE DOMINION CHILD</textPath>
      </text>
    </g>

  </g>
</svg>